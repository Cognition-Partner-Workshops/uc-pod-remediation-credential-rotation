apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base/deployment.yaml
  - ../../base/configmap.yaml
  - ../../base/rbac.yaml
  - ../../base/secret.yaml

patches:
  - target:
      kind: ConfigMap
      name: credential-rotation-config
    patch: |
      - op: replace
        path: /data/LOG_LEVEL
        value: "WARNING"
      - op: replace
        path: /data/ROTATION_CHECK_INTERVAL
        value: "120"
